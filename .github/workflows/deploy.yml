name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE: meditation-frontend
  DOCKER_VERSION: v1.0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Create deploy directory on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "mkdir -p /home/${{ secrets.EC2_USER }}/meditation-frontend"

      - name: Upload docker-compose.yml to EC2
        run: |
          scp -o StrictHostKeyChecking=no docker-compose.yml \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/meditation-frontend/docker-compose.yml

      - name: Deploy to EC2 using docker-compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash << DEPLOY_SCRIPT
            set -e
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            cd /home/${{ secrets.EC2_USER }}/meditation-frontend
            
            # Export variables for docker-compose
            export DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}'
            export DOCKER_VERSION='${{ env.DOCKER_VERSION }}'
            export NEXT_PUBLIC_API_URL='${{ secrets.NEXT_PUBLIC_API_URL }}'
            
            echo "🛑 Stopping and removing existing containers"
            docker compose stop frontend || true
            docker compose rm -f frontend || true
            
            echo "⬇️ Pulling latest image"
            docker compose pull frontend
            
            echo "🚀 Starting frontend service"
            docker compose up -d frontend
            
            echo "📊 Container status:"
            docker compose ps
          DEPLOY_SCRIPT

      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash << VERIFY_SCRIPT
            cd /home/${{ secrets.EC2_USER }}/meditation-frontend
            if docker compose ps | grep -q frontend; then
              echo "✅ Frontend running OK"
            else
              echo "❌ Frontend FAILED"
              exit 1
            fi
          VERIFY_SCRIPT
